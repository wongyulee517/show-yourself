# 모든 논문을 여기에 적습니다. 연도별로 자동 정렬되고(최신 연도 위),
# selected: true 인 논문은 상단 "Selected Publications" 카드로 다시 표시되며
# 전체 목록에서도 하이라이트됩니다.
#
# title    : 논문 제목
# authors  : 저자 목록. profile.yaml 의 author_aliases 와 같은 이름은 굵게 표시됩니다.
# venue    : 학회 / 저널 이름 (이탤릭으로 표시)
# year     : 연도 (정수)
# selected : true / false (생략하면 false)
# links    : 버튼으로 표시될 링크들. 키가 버튼 라벨이 됩니다. (PDF, Code, BibTeX, Slides, Poster, Video, arXiv ...)
# note     : (선택) 수상 내역 등 한 줄 메모. 예: "Oral presentation", "Best Paper Award"

# - title: "[Paper title 1: a descriptive title of the work]"
#   authors: ["[Your Name]", "[Coauthor A]", "[Coauthor B]"]
#   venue: "[Conference / Journal]"
#   year: 2026
#   selected: true
#   links:
#     PDF: "#"
#     Code: "#"
#     BibTeX: "#"

# - title: "[Paper title 2]"
